<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GloberBooks</title>
<link rel="stylesheet" href="/css/styles.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<main>
  <h1>GloberBooks</h1>
  <div id="messages" role="status" aria-label="Messages" class="messages"></div>

  <form id="add-form" method="post" novalidate>
    <h2 class="visually-hidden">Add a book</h2>
    <div class="field">
      <label for="title">Title</label>
      <input id="title" name="title" type="text" autocomplete="off" autofocus>
      <p id="title-error" class="field-error" hidden></p>
    </div>
    <div class="field">
      <label for="author">Author</label>
      <input id="author" name="author" type="text" autocomplete="off">
      <p id="author-error" class="field-error" hidden></p>
    </div>
    <div class="field">
      <label for="status">Status</label>
      <select id="status" name="status">
        <option value="unread" selected>Unread</option>
        <option value="reading">Reading</option>
        <option value="completed">Completed</option>
      </select>
      <p id="status-error" class="field-error" hidden></p>
    </div>
    <button type="submit" id="add-button">Add book</button>
  </form>

  <section aria-labelledby="books-heading">
    <h2 id="books-heading" tabindex="-1">Your books</h2>
    <fieldset id="filter" class="filter">
      <legend>Filter by status</legend>
      <label><input type="radio" name="filter" value="all" checked> All</label>
      <label><input type="radio" name="filter" value="unread"> Unread</label>
      <label><input type="radio" name="filter" value="reading"> Reading</label>
      <label><input type="radio" name="filter" value="completed"> Completed</label>
    </fieldset>
    <p id="count" class="count" hidden></p>
    <p id="list-status" role="status"></p>
    <button type="button" id="show-all" hidden>Show all books</button>
    <button type="button" id="try-again" hidden>Try again</button>
    <ul id="book-list" aria-label="Books" hidden></ul>
  </section>
</main>

<template id="entry-template">
  <li class="entry">
    <p class="entry-title"></p>
    <p class="entry-author"></p>
    <p class="entry-status"></p>
    <p class="entry-added"></p>
    <p class="entry-completed" hidden></p>
    <p class="entry-rating" hidden></p>
    <p class="entry-mismatch" hidden></p>
    <div class="entry-controls">
      <select class="entry-status-select">
        <option value="unread">Unread</option>
        <option value="reading">Reading</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <!-- Task 37 mounts the rating group in this element; it is shown only on completed entries. -->
    <div class="entry-rating-mount" hidden></div>
    <p class="entry-message" role="status"></p>
  </li>
</template>
<dialog id="duplicate-dialog" aria-labelledby="duplicate-heading" aria-describedby="duplicate-text">
  <h2 id="duplicate-heading">Possible duplicate</h2>
  <p id="duplicate-text">This book may already exist. Add anyway?</p>
  <p id="duplicate-title" class="dialog-title"></p>
  <p id="duplicate-author"></p>
  <p id="duplicate-status"></p>
  <p id="duplicate-added"></p>
  <div class="dialog-actions">
    <button type="button" id="duplicate-cancel" autofocus>Cancel</button>
    <button type="button" id="duplicate-confirm">Add anyway</button>
  </div>
</dialog>
<dialog id="status-dialog" aria-labelledby="status-heading" aria-describedby="status-text">
  <h2 id="status-heading">Confirm status change</h2>
  <p id="status-text"></p>
  <div class="dialog-actions">
    <button type="button" id="status-cancel" autofocus>Cancel</button>
    <button type="button" id="status-confirm">Continue</button>
  </div>
</dialog>
</body>
</html>
